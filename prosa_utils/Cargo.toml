[package]
name = "prosa-utils"
version = "0.5.2"
authors.workspace = true
description = "ProSA utils"
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
include.workspace = true

[features]
default = ["msg", "config", "config-openssl", "config-observability"]
msg = ["dep:bytes", "dep:chrono", "dep:hex", "dep:num-traits"]
msg-serde = ["msg", "dep:serde", "chrono/serde", "bytes/serde"]
config = ["dep:glob", "dep:notify", "dep:log", "dep:serde", "dep:base64", "dep:percent-encoding", "dep:uuid", "dep:url"]
config-openssl = ["config", "dep:openssl", "dep:bytes"]
config-openssl-vendored = ["config-openssl", "openssl/vendored"]
config-observability = ["dep:chrono", "dep:log", "dep:tracing-core", "dep:tracing-subscriber", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-stdout", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing"]
config-observability-gzip = ["dep:flate2", "opentelemetry-otlp/gzip-tonic", "opentelemetry-otlp/gzip-http"]
config-observability-prometheus = ["config-observability", "dep:bytes", "dep:prometheus", "dep:opentelemetry-prometheus", "dep:tokio", "dep:hyper", "dep:http-body-util", "dep:hyper-util"]
queue = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.prosa]
tvf = ["msg::simple_string_tvf::SimpleStringTvf"]

[lints.clippy]
unwrap_used = "deny"

[dependencies]
thiserror.workspace = true
bytes = { workspace = true, optional = true }
url = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }

# Config
glob = { version = "0.3", optional = true }
notify = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }
percent-encoding = { version = "2", optional = true }
uuid = { version = "1", optional = true, features = ["v1", "v4"] }

# Config OpenSSL
openssl = { workspace = true, optional = true }

# Config Observability
log = { workspace = true, optional = true }
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = ">=0.3.20, < 0.4", features = ["std", "env-filter"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-stdout = { version = "0.33", optional = true, features = ["metrics", "trace", "logs"]}
opentelemetry-otlp = { version = "0.33", optional = true, features = ["metrics", "trace", "logs", "reqwest-rustls", "grpc-tonic", "http-json"]}
prometheus = { workspace = true, optional = true }
opentelemetry-prometheus = { version = "0.33", optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }

# Web Observability
tokio = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
tokio.workspace = true
tokio-openssl = "0.6"
yaml_serde.workspace = true
prosa-macros = { path = "../prosa_macros" }
