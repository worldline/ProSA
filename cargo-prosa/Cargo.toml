[package]
name = "cargo-prosa"
version = "0.5.1"
authors.workspace = true
description = "ProSA utility to package and deliver a builded ProSA"
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
include.workspace = true

[[bin]]
name = "cargo-prosa"
path = "src/main.rs"

# Prebuilt binaries published by .github/workflows/release.yml.
# `{ version }` is this crate's version, so it must match the git tag of the release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
clap = "4"
clap_complete = "4"
serde.workspace = true
toml.workspace = true
toml_edit = { version = "0.25", features = ["serde"] }
serde_json = "1"
tera = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = { version = "3", features = ["regex"] }
